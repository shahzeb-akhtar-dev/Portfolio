<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 1600 300" width="1600" height="300" fill="none">

  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCE9FF" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#B7CEFF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#DCE9FF" stop-opacity=".95"/>
    </linearGradient>

    <linearGradient id="main" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBD2FF" stop-opacity=".88"/>
      <stop offset=".5" stop-color="#8FB3FA" stop-opacity=".78"/>
      <stop offset="1" stop-color="#BBD2FF" stop-opacity=".88"/>
    </linearGradient>

    <linearGradient id="front" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FBFF" stop-opacity=".98"/>
      <stop offset=".5" stop-color="#EAF2FF" stop-opacity=".94"/>
      <stop offset="1" stop-color="#F9FBFF" stop-opacity=".98"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- One exact wave cycle. It is reused, not raster-image duplicated. -->
    <g id="cycle">
      <!-- Rear pale-blue ribbon -->
      <path d="M0 92 C125 42 235 62 350 118 C480 182 590 190 720 130 C855 68 965 52 1090 98 C1225 148 1315 206 1445 164 C1515 142 1560 103 1600 82 L1600 224 C1470 270 1360 278 1235 235 C1105 190 1010 190 880 237 C745 286 620 275 500 230 C370 181 260 180 145 215 C82 234 38 229 0 216 Z" fill="url(#back)"/>

      <!-- Main blue ribbon -->
      <path d="M0 92 C135 38 255 65 380 140 C505 214 620 221 760 151 C900 80 1005 65 1130 110 C1265 159 1350 218 1470 178 C1530 158 1570 120 1600 94 L1600 207 C1470 247 1370 257 1250 220 C1110 177 1015 164 880 212 C740 262 625 258 505 215 C380 170 270 168 155 200 C88 219 40 211 0 199 Z" fill="url(#main)"/>

      <!-- Front white/blue ribbon -->
      <path d="M0 126 C120 82 225 94 335 151 C455 214 555 225 690 186 C820 148 920 126 1035 162 C1165 203 1260 252 1385 220 C1470 198 1530 153 1600 126 L1600 245 C1515 275 1420 281 1305 251 C1185 220 1080 188 955 222 C820 258 700 286 555 241 C425 201 315 181 195 211 C105 234 45 224 0 206 Z" fill="url(#front)"/>

      <!-- Signature blue contour -->
      <path d="M0 92 C135 38 255 65 380 140 C505 214 620 221 760 151 C900 80 1005 65 1130 110 C1265 159 1350 218 1470 178 C1530 158 1570 120 1600 94"
        stroke="#2875F5" stroke-width="4" stroke-linecap="round"/>

      <!-- Subtle inner contour -->
      <path d="M0 126 C120 82 225 94 335 151 C455 214 555 225 690 186 C820 148 920 126 1035 162 C1165 203 1260 252 1385 220 C1470 198 1530 153 1600 126"
        stroke="#C0D5FF" stroke-width="2" stroke-linecap="round" opacity=".95"/>

      <!-- Decorative dots -->
      <circle cx="115" cy="177" r="13" fill="#4C87F5"/>
      <circle cx="148" cy="190" r="4" fill="#91B4F8"/>
      <circle cx="1012" cy="112" r="5" fill="#6C9BF4"/>
      <circle cx="1048" cy="113" r="12" fill="#4C87F5"/>
      <circle cx="1080" cy="128" r="4" fill="#91B4F8"/>
    </g>

    <g id="shadowCycle" opacity=".22" filter="url(#shadow)">
      <path d="M0 101 C125 45 235 68 350 128 C475 194 585 196 720 132 C850 70 965 58 1090 104 C1225 154 1320 210 1445 165 C1510 142 1560 105 1600 78 L1600 270 C1470 294 1350 292 1230 250 C1100 205 1000 204 875 250 C735 301 615 289 495 245 C365 197 255 195 140 232 C80 251 35 244 0 230 Z"
        fill="#A8C3F7"/>
    </g>
  </defs>

  <g id="movingWaveTrack">
    <!-- Exact second cycle: generated with <use>, so the join is mathematically identical. -->
    <use href="#shadowCycle" x="0" y="0"/>
    <use href="#shadowCycle" x="1600" y="0"/>

    <use href="#cycle" x="0" y="0"/>
    <use href="#cycle" x="1600" y="0"/>

    <!-- Self-contained SVG animation; no CSS animation is required on the Vue <img>. -->
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      from="0 0"
      to="-1600 0"
      dur="18s"
      repeatCount="indefinite"
      calcMode="linear"/>
  </g>
</svg>